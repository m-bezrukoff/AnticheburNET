name: Filogic 25.12 packages
on:
  workflow_dispatch:
    inputs:
      package_version:
        type: string
        default: '1.0.10'
        description: AnticheburNET release version
      components_from:
        type: string
        default: ''
        description: Reuse unchanged ARM64 cores from a previously tested release
      publish:
        type: boolean
        default: true
        description: Publish tested packages as the latest release
      update_baseline:
        type: boolean
        default: true
        description: Build version 1.0.0 for an update test
  push:
    branches: [main, 'anticheburnet/**']
    paths: ['components/**', '.github/workflows/filogic-build.yml', 'build.sh']
permissions:
  contents: write
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PACKAGE_VERSION: ${{ inputs.package_version || '1.0.10' }}
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-go@v5.0.0
        if: inputs.components_from == ''
        with:
          go-version: '1.26.8'
          cache: false
      - run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libjson-c-dev libglib2.0-dev python3-venv ninja-build pkg-config curl fakeroot file gawk git patch perl tar unzip util-linux xz-utils zstd bzip2 squashfs-tools qemu-user iproute2 iputils-ping openssl
          git clone --depth 1 --branch v0.0.20250529 https://github.com/jow-/ucode.git /tmp/ucode
          cmake -S /tmp/ucode -B /tmp/ucode/build -DUBUS_SUPPORT=OFF -DUCI_SUPPORT=OFF -DULOOP_SUPPORT=OFF
          cmake --build /tmp/ucode/build --parallel
          sudo cmake --install /tmp/ucode/build
          sudo ldconfig
      - name: Build test emulator with Linux SO_MARK forwarding
        if: inputs.components_from == ''
        run: bash components/build-test-emulator.sh
      - name: Build AnticheburNET and LuCI
        run: bash build.sh "$PACKAGE_VERSION" "$PWD/dist/filogic"
      - name: Build ARM64 components
        if: inputs.components_from == ''
        run: bash components/build.sh "$PACKAGE_VERSION" "$PWD/dist/filogic"
      - name: Reuse previously tested ARM64 components
        if: inputs.components_from != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENTS_TAG: ${{ inputs.components_from }}
        run: |
          mkdir -p .build/reused-components
          gh release download "$COMPONENTS_TAG" --repo "$GITHUB_REPOSITORY" --dir .build/reused-components --pattern '*_aarch64_cortex-a53.apk' --pattern SHA256SUMS
          cd .build/reused-components
          awk '/aarch64_cortex-a53[.]apk$/ {print}' SHA256SUMS > ARM64SUMS
          test "$(wc -l < ARM64SUMS)" -eq 3
          sha256sum -c ARM64SUMS
          cp ./*.apk ../../dist/filogic/
      - name: Build update test baseline
        if: github.event_name == 'workflow_dispatch' && inputs.update_baseline
        run: bash build.sh 1.0.0 "$PWD/dist/update-baseline"
      - name: Upload update baseline
        if: github.event_name == 'workflow_dispatch' && inputs.update_baseline
        uses: actions/upload-artifact@v4.6.2
        with:
          name: anticheburnet-update-baseline-1.0.0
          path: dist/update-baseline/*
          if-no-files-found: error
      - name: Prepare release checksums
        run: |
          cp install.sh dist/filogic/install.sh
          cd dist/filogic
          sha256sum ./*.apk > SHA256SUMS
          sha256sum ./*.ipk > SHA256SUMS-IPK
      - name: Publish tested release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: softprops/action-gh-release@v2.4.0
        with:
          tag_name: ${{ inputs.package_version }}
          target_commitish: ${{ github.sha }}
          name: AnticheburNET ${{ inputs.package_version }}
          make_latest: true
          files: dist/filogic/*
          body_path: docs/RELEASE-${{ inputs.package_version }}.md
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: anticheburnet-filogic-25.12
          path: dist/filogic/*
          retention-days: 30
          if-no-files-found: error
      - name: Preserve emulator and core for focused failure diagnosis
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: happ-runtime-diagnostics
          path: |
            .build/components/sing-box.arm64
            .build/test-qemu/build/qemu-aarch64
          retention-days: 3
          if-no-files-found: ignore
