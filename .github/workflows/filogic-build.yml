name: Filogic 25.12 packages
on:
  workflow_dispatch:
  push:
    branches: [main, 'forkop-plus/**']
    paths: ['components/**', '.github/workflows/filogic-build.yml', 'build.sh']
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-go@v5.0.0
        with:
          go-version: '1.26.8'
          cache: false
      - run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y build-essential curl fakeroot file gawk git patch perl tar unzip util-linux xz-utils zstd qemu-user
      - name: Build Forkop and LuCI
        run: bash build.sh 1.0.0 "$PWD/dist/filogic"
      - name: Build ARM64 components
        run: bash components/build.sh 1.0.0 "$PWD/dist/filogic"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: forkop-plus-filogic-25.12
          path: dist/filogic/*
          retention-days: 30
          if-no-files-found: error
