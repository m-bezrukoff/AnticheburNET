name: AnticheburNET integration checks
on:
  push:
    branches: [main, 'anticheburnet/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
      - run: git fetch --no-tags https://github.com/m-bezrukoff/AnticheburNET.git refs/tags/0.7.19.9:refs/tags/0.7.19.9
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libjson-c-dev pkg-config shellcheck
          git clone --depth 1 --branch v0.0.20250529 https://github.com/jow-/ucode.git /tmp/ucode
          cmake -S /tmp/ucode -B /tmp/ucode/build -DUBUS_SUPPORT=OFF -DUCI_SUPPORT=OFF -DULOOP_SUPPORT=OFF
          cmake --build /tmp/ucode/build --parallel
          sudo cmake --install /tmp/ucode/build
          sudo ldconfig
      - run: |
          find anticheburnet/files/usr/lib components -name '*.uc' -print0 | xargs -0 -n1 ucode -c -o /dev/null
          find anticheburnet/files/usr/lib components -name '*.uc' -print0 | xargs -0 -n1 ucode -S -c -o /dev/null
      - name: Check Happ and AWG subscription imports
        run: |
          bash -x tests/awg_subscription.sh
          bash -x tests/happ_subscription.sh
      - run: |
          printf '%s\0' tests/*.sh | xargs -0 -n1 -P4 bash
      - run: |
          mapfile -d '' scripts < <(find . -not -path './.git/*' -not -path './.build/*' -type f \( -name '*.sh' -o -path '*/etc/init.d/*' -o -path '*/usr/bin/anticheburnet-awg-run' -o -path '*/usr/bin/anticheburnet-xray-*' \) -print0)
          shellcheck --severity=error "${scripts[@]}"
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: fe-app-anticheburnet
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: '22'
      - run: corepack enable && yarn install --frozen-lockfile
      - run: yarn lint --max-warnings=0
      - run: yarn test --run --maxWorkers=2
      - run: yarn build && git diff --exit-code -- ../luci-app-anticheburnet/htdocs/luci-static/resources/view/anticheburnet/main.js
